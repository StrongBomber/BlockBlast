name: Stop hung Android probe
on:
  push:
    branches: [arena/fe683328-blockblast]
    paths: [.github/workflows/cancel-hung-probe.yml]
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/40908124716/cancel"
