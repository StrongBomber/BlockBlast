name: Temporary emulator probe
on:
  push:
    branches: [arena/fe683328-blockblast]
    paths: [.github/workflows/emulator-probe.yml, tools/emulator_probe.sh, tools/prepare_emulator_splits.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'gdown==5.2.0'
      - name: Download source archive
        run: gdown --id 10qUhPRvMhCKxXPAH4TYzBk7c8JSnsPql -O "$RUNNER_TEMP/source.xapk"
      - name: Prepare disposable, re-signed emulator splits
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned" "$RUNNER_TEMP/aligned" "$RUNNER_TEMP/signed"
          python3 tools/prepare_emulator_splits.py "$RUNNER_TEMP/source.xapk" "$RUNNER_TEMP/unsigned"
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.keystore" -storepass android -keypass android -alias test -dname 'CN=Temporary test' -keyalg RSA -keysize 2048 -validity 1 >/dev/null 2>&1
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          for split in "$RUNNER_TEMP"/unsigned/*.apk; do
            name=$(basename "$split")
            "$bt/zipalign" -p -f 4 "$split" "$RUNNER_TEMP/aligned/$name"
            "$bt/apksigner" sign --ks "$RUNNER_TEMP/test.keystore" --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/signed/$name" "$RUNNER_TEMP/aligned/$name"
          done
      - name: Inspect launcher class with REA
        run: |
          wget -q https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar -O "$RUNNER_TEMP/jadx.jar"
          echo '6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75  '"$RUNNER_TEMP"'/jadx.jar' | sha256sum -c -
          export REA_JADX_MCP_JAR="$RUNNER_TEMP/jadx.jar"
          export REA_JADX_HEAP_MIB=4096 REA_JADX_OPERATION_TIMEOUT_MS=600000
          npx -y rea-agents@6.7.0 inspect-android-class "$RUNNER_TEMP/unsigned/com.block.juggle.apk" org.cocos2dx.javascript.AppActivity --format json > analysis/rea-activity.txt 2>&1 || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probe game in disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096 -cores 4
          script: bash tools/emulator_probe.sh
      - name: Save probe results only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f analysis/emulator-probe.txt ]; then
            git add analysis/emulator-probe.txt
            if [ -f analysis/rea-activity.txt ]; then git add analysis/rea-activity.txt; fi
            if ! git diff --cached --quiet; then
              git commit -m 'Record emulator probe results'
              git push origin HEAD:${GITHUB_REF_NAME}
            fi
          fi
