name: Remove temporary source artifact
on:
  push:
    branches: [arena/fe683328-blockblast]
    paths: [.github/workflows/temporary-fetch.yml]
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/12909021754"
