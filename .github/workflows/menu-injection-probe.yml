name: Experimental game menu bootstrap probe
on:
  push:
    branches: [arena/fe683328-blockblast]
    paths: [tools/test_menu_injection.sh, tools/InjectBinaryManifest.java]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip apksigner zipalign adb tesseract-ocr
          python3 -m pip install --break-system-packages pillow
      - name: Download source archive
        run: bash tools/download_source.sh "$RUNNER_TEMP/source.xapk"
      - name: Build and test disposable menu bootstrap
        id: probe
        shell: bash
        env:
          USER_APPROVED_TERMS: '1'
        run: |
          set +e
          timeout --kill-after=15s 1100 bash tools/test_menu_injection.sh > analysis/menu-injection-probe.txt 2>&1
          status=$?
          echo "probe_exit=$status" >> analysis/menu-injection-probe.txt
          exit "$status"
      - name: Save diagnostics only
        if: always()
        run: |
          if [ -f analysis/menu-injection-probe.txt ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add analysis/menu-injection-probe.txt
            if [ -f analysis/score-test-failure.txt ]; then git add analysis/score-test-failure.txt; fi
            if ! git diff --cached --quiet; then
              git commit -m 'Record experimental menu injection probe'
              git push origin HEAD:${GITHUB_REF_NAME}
            fi
          fi
