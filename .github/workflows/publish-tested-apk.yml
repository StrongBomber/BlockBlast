name: Publish tested ARM64 APK
on:
  push:
    branches: [arena/fe683328-blockblast]
    paths: [.github/workflows/publish-tested-apk.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact tested build
        uses: actions/download-artifact@v4
        with:
          name: BlockBlast-10.9.2-mod-arm64
          path: release
          github-token: ${{ github.token }}
          run-id: 40951603156
      - name: Check digest and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          (
          set -e
          cd release
          echo 'd316f9fee1388f51542d31416e7e8b106fa5eaa9a331d346269b0eed990b572b  BlockBlast-10.9.2-mod-arm64.apk' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          gh release upload blockblast-mod-10.9.2-v2 BlockBlast-10.9.2-mod-arm64.apk SHA256SUMS.txt
          ) > "$RUNNER_TEMP/publish-result.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/publish-result.txt"
          mkdir -p analysis
          cp "$RUNNER_TEMP/publish-result.txt" analysis/publication-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/publication-result.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record APK publication result'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          exit "$status"
