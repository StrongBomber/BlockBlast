name: Publish tested ARM64 APK
on:
  push:
    branches: [arena/fe683328-blockblast]
    paths: [.github/workflows/publish-tested-apk.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download the exact tested build
        uses: actions/download-artifact@v4
        with:
          name: BlockBlast-10.9.2-mod-arm64
          path: release
          github-token: ${{ github.token }}
          run-id: 40951603156
      - name: Check digest and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          echo 'd316f9fee1388f51542d31416e7e8b106fa5eaa9a331d346269b0eed990b572b  BlockBlast-10.9.2-mod-arm64.apk' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat > release-notes.txt <<'EOF'
          Block Blast 10.9.2 için ARM64 (arm64-v8a) modlu tek APK.

          Açılır/kapanır ve sürüklenebilir menü; klasik modda kapalı/1x, 10x, 100x, 1000x, 10000x ve 100000x skor artışı. Android 13 ARM64 Redroid üzerinde gerçek oyun hamleleri, altı seçenek, skorun ve 100000x seçiminin yeniden açılışta korunması test edildi. Fiziksel cihazlarda ve diğer oyun modlarında kapsamlı test yapılmadı.

          APK, orijinal geliştirici anahtarıyla değil, bu derlemeye özgü bir test anahtarıyla imzalanmıştır. Orijinal uygulamanın üzerine güncelleme olarak kurulamaz; orijinali kaldırmak kayıtları silebilir. Başka yeniden derlemeler de farklı anahtara sahip olabilir ve bu APK'nın üzerine kurulamayabilir.

          Test: https://github.com/StrongBomber/BlockBlast/actions/runs/40951603156
          EOF
          gh release create blockblast-mod-10.9.2-v2 BlockBlast-10.9.2-mod-arm64.apk SHA256SUMS.txt --target e3454463c596fa6c242dc5d444cd6917d96049bb --title 'Block Blast 10.9.2 — ARM64 mod v2' --notes-file release-notes.txt
