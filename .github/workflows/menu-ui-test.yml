name: Menu UI smoke test
on:
  push:
    branches: [arena/fe683328-blockblast]
    paths: [menu/**, .github/workflows/menu-ui-test.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build disposable test application
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          bt="$ANDROID_HOME/build-tools/35.0.0"
          jar="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p "$RUNNER_TEMP/classes" "$RUNNER_TEMP/dex"
          javac --release 8 -cp "$jar" -d "$RUNNER_TEMP/classes" $(find menu/src/main menu/testapp/src -name '*.java')
          "$bt/d8" --min-api 23 --lib "$jar" --output "$RUNNER_TEMP/dex" $(find "$RUNNER_TEMP/classes" -name '*.class')
          "$bt/aapt" package -f -M menu/testapp/AndroidManifest.xml -A menu/src/main/assets -I "$jar" -F "$RUNNER_TEMP/unsigned.apk"
          (cd "$RUNNER_TEMP/dex" && zip -q "$RUNNER_TEMP/unsigned.apk" classes.dex)
          "$bt/zipalign" -f 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.keystore" -storepass android -keypass android -alias test -dname 'CN=Disposable test' -keyalg RSA -validity 1 >/dev/null 2>&1
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/test.keystore" --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/menu-smoke.apk" "$RUNNER_TEMP/aligned.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run disposable menu UI test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 menu/testapp/ui_smoke.py
